<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Acesso da equipe administrativa.">
  <link rel="icon" href="assets/logo-cnspp.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="assets/logo-cnspp.png" alt="Logo da Associação" width="52" height="52">
    <span>Associação Beneficente<br><b>Nossa Senhora de Piedade</b></span>
  </a>
  <nav aria-label="Menu principal">
    <a href="index.html">Sobre Nós</a>
    <a href="campanhas.html">Nossos Projetos</a>

  </nav>

<main class="auth-page container">
  <div class="auth-box">
    <h2>Área Restrita</h2>
    <p>Acesso exclusivo da equipe da Associação.<br>Para doar ou ser voluntário não é preciso login.</p>
    <form id="loginForm">
      <div class="input-group"><label for="email">E-mail</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="input-group"><label for="senha">Senha</label><input type="password" id="senha" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Entrar</button>
    </form>
    <p class="auth-link center" style="margin-top:18px"><a href="index.html">← Voltar para o site</a></p>
  </div>
</main>

<script src="vendor/sweetalert2.all.min.js"></script>
<script src="js/api.js"></script>
